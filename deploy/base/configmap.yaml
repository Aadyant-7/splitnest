apiVersion: v1
kind: ConfigMap
metadata:
  name: splitnest-config
data:
  DB_URL: jdbc:postgresql://postgres:5432/splitnest
  DB_USER: splitnest
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SERVER_PORT: "8080"
  MANAGEMENT_PORT: "9090"
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=20
