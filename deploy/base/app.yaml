apiVersion: v1
kind: Service
metadata:
  name: splitnest
  labels:
    app.kubernetes.io/name: splitnest
spec:
  selector:
    app.kubernetes.io/name: splitnest
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9090
      targetPort: management
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitnest
  labels:
    app.kubernetes.io/name: splitnest
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: splitnest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: splitnest
        app.kubernetes.io/part-of: splitnest
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/aadyant-7/splitnest:bootstrap
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: splitnest-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: splitnest-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: splitnest-secrets
                  key: JWT_SECRET
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9090
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
