apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  serviceName: postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: splitnest
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          env:
            - name: POSTGRES_DB
              value: splitnest
            - name: POSTGRES_USER
              value: splitnest
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: splitnest-secrets
                  key: DB_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: [pg_isready, -U, splitnest, -d, splitnest]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [pg_isready, -U, splitnest, -d, splitnest]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, splitnest, -d, splitnest]
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            # PostgreSQL 18 stores versioned data below this parent directory.
            - name: data
              mountPath: /var/lib/postgresql
            - name: runtime
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
