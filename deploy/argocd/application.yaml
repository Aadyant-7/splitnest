apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: splitnest-local
  namespace: argocd
  # No cascading-delete finalizer: deleting this Application must not delete the database.
spec:
  project: default
  source:
    repoURL: https://github.com/Aadyant-7/splitnest.git
    targetRevision: deploy/local
    path: deploy/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: splitnest
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: splitnest
      namespace: splitnest
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - PruneLast=true
